announce:
  target:
    entity:
      domain: assist_satellite
      supported_features:
        - assist_satellite.AssistSatelliteEntityFeature.ANNOUNCE
  fields:
    message:
      required: false
      example: "Time to wake up!"
      default: ""
      selector:
        text:
    media_id:
      required: false
      selector:
        media:
          accept:
            - audio/*
    preannounce:
      required: false
      default: true
      selector:
        boolean:
    preannounce_media_id:
      required: false
      selector:
        media:
          accept:
            - audio/*
start_conversation:
  target:
    entity:
      domain: assist_satellite
      supported_features:
        - assist_satellite.AssistSatelliteEntityFeature.START_CONVERSATION
  fields:
    start_message:
      required: false
      example: "You left the lights on in the living room. Turn them off?"
      default: ""
      selector:
        text:
    start_media_id:
      required: false
      selector:
        media:
          accept:
            - audio/*
    extra_system_prompt:
      required: false
      selector:
        text:
    preannounce:
      required: false
      default: true
      selector:
        boolean:
    preannounce_media_id:
      required: false
      selector:
        media:
          accept:
            - audio/*
ask_question:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          filter:
            domain: assist_satellite
            supported_features:
              - assist_satellite.AssistSatelliteEntityFeature.START_CONVERSATION
    question:
      required: false
      example: "What kind of music would you like to play?"
      default: ""
      selector:
        text:
    question_media_id:
      required: false
      selector:
        media:
          accept:
            - audio/*
    preannounce:
      required: false
      default: true
      selector:
        boolean:
    preannounce_media_id:
      required: false
      selector:
        media:
          accept:
            - audio/*
    answers:
      required: false
      selector:
        object:
          label_field: sentences
          description_field: id
          multiple: true
          translation_key: answers
          fields:
            id:
              required: true
              selector:
                text:
            sentences:
              required: true
              selector:
                text:
                  multiple: true
set_speech_threshold:
  name: Порог речи (внутри команды)
  description: >-
    Порог вероятности речи Silero VAD, используемый ВО ВРЕМЯ голосовой команды.
    Определяет, считает ли система текущий аудио-фрагмент речью или тишиной.
    Низкие значения (0.1-0.3) — VAD более чувствителен: распознаёт тихую речь,
    но может принимать фоновый шум за речь. Высокие значения (0.6-0.8) —
    требуется более чёткая и громкая речь, фоновый шум игнорируется.
    По умолчанию: 0.5.
  target:
    entity:
      domain: assist_satellite
  fields:
    value:
      name: Порог речи
      required: true
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.05
          mode: slider
set_vad_timeout:
  name: Таймаут записи (макс. длина)
  description: >-
    Максимальная длительность одной голосовой команды в секундах.
    Если пользователь говорит дольше этого времени, запись будет принудительно
    остановлена и отправлена на распознавание речи.
    Для коротких команд ("включи свет") достаточно 10-15 секунд.
    Для длинных диктовок — 30-60 секунд. По умолчанию: 15.
  target:
    entity:
      domain: assist_satellite
  fields:
    value:
      name: Таймаут (секунды)
      required: true
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: slider
          unit_of_measurement: s
set_silence_seconds:
  name: Длительность тишины до обрыва
  description: >-
    Сколько секунд непрерывной тишины должно пройти, прежде чем запись
    голосовой команды будет остановлена. Это время ожидания после того,
    как вы перестали говорить, до обработки команды.
    Короткие значения (0.5-1.0с) — ассистент реагирует быстрее, но может
    обрезать естественные паузы между предложениями.
    Длинные значения (2.0-3.0с) — допускают паузы в речи, но ассистент
    медленнее начинает обработку. По умолчанию: 1.5.
  target:
    entity:
      domain: assist_satellite
  fields:
    value:
      name: Тишина до обрыва (секунды)
      required: true
      selector:
        number:
          min: 0.3
          max: 10
          step: 0.1
          mode: slider
          unit_of_measurement: s
set_command_seconds:
  name: Минимальная длительность команды
  description: >-
    Минимальная длительность голосовой команды в секундах. Запись не будет
    остановлена, пока не пройдёт это время И не истечёт таймер тишины.
    Предотвращает случайные обрывы на очень коротких фразах.
    Увеличьте, если команды обрезаются слишком рано. Уменьшите, если
    ассистент слишком долго ждёт перед обработкой.
    По умолчанию: 1.0.
  target:
    entity:
      domain: assist_satellite
  fields:
    value:
      name: Мин. длительность (секунды)
      required: true
      selector:
        number:
          min: 0.3
          max: 10
          step: 0.1
          mode: slider
          unit_of_measurement: s
set_before_command_speech_threshold:
  name: Порог речи (начало команды)
  description: >-
    Порог вероятности речи для ОБНАРУЖЕНИЯ НАЧАЛА голосовой команды.
    Обычно устанавливается ниже основного порога речи, чтобы система
    могла уловить начало речи даже при тихом голосе.
    Низкие значения (0.05-0.15) — распознают речь раньше, но могут
    срабатывать на шум. Высокие значения (0.3-0.5) — требуют более
    чёткой речи для начала записи. По умолчанию: 0.2.
  target:
    entity:
      domain: assist_satellite
  fields:
    value:
      name: Порог начала команды
      required: true
      selector:
        number:
          min: 0.05
          max: 0.9
          step: 0.05
          mode: slider
set_vad_mode:
  name: Режим VAD
  description: >-
    Режим работы Silero VAD.
    singleton — одна модель на все pipeline, экономит память. Рекомендуемый режим.
    per_pipeline — каждый pipeline создаёт свою копию модели. Изолирует pipeline,
    но использует больше памяти (каждый экземпляр ~10 МБ). Разницы в качестве
    распознавания нет, так как модель Silero JIT не имеет внутреннего состояния.
    По умолчанию: singleton.
  target:
    entity:
      domain: assist_satellite
  fields:
    value:
      name: Режим VAD
      required: true
      selector:
        select:
          options:
            - singleton
            - per_pipeline
set_before_command_timeout:
  name: Таймаут до начала команды
  description: >-
    Максимальное время ожидания начала речи после активации ассистента.
    Если за это время не обнаружена речь (вероятность не превышает порог
    начала команды), запись прерывается и ассистент возвращается в режим ожидания.
    Помогает не висеть 30 секунд при случайной активации без речи.
    По умолчанию: 4.0 секунды.
  target:
    entity:
      domain: assist_satellite
  fields:
    value:
      name: Таймаут до речи (секунды)
      required: true
      selector:
        number:
          min: 1
          max: 30
          step: 0.5
          mode: slider
          unit_of_measurement: s
set_noise_suppression:
  name: Шумоподавление
  description: >-
    Уровень шумоподавления Speex DSP. Убирает фоновый шум из аудио перед
    отправкой на распознавание речи и VAD.
    0 — выключено (по умолчанию). 1 — минимальное. 2 — среднее. 3 — высокое.
    4 — максимальное. Высокие уровни могут подавлять тихую речь.
    Рекомендуется начать с 1 или 2 для шумных помещений.
  target:
    entity:
      domain: assist_satellite
  fields:
    value:
      name: Уровень шумодава
      required: true
      selector:
        number:
          min: 0
          max: 4
          step: 1
          mode: slider
set_auto_gain:
  name: Автоматическое усиление
  description: >-
    Автоматическое усиление сигнала в дБFS (децибелы относительно полной шкалы).
    Полезно если микрофон спутника тихий и речь плохо распознаётся.
    0 — выключено (по умолчанию). Рекомендуемые значения: 10-20 дБ.
    Слишком высокие значения (25-31) могут привести к искажениям.
  target:
    entity:
      domain: assist_satellite
  fields:
    value:
      name: Усиление (дБFS)
      required: true
      selector:
        number:
          min: 0
          max: 31
          step: 1
          mode: slider
          unit_of_measurement: dB
